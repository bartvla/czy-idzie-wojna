name: Lotnictwo (co 5 min)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

# Ta sama grupa co deploy.yml: oba workflow nadpisują gałąź data, więc nie mogą działać równolegle.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions: {}

jobs:
  aircraft:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # push na gałąź data
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Przywróć gałąź data
        run: |
          mkdir -p public/data
          if git fetch --depth=1 origin data 2>/dev/null; then
            git archive origin/data | tar -x -C public/data
          fi

      - name: Pobierz lotnictwo wojskowe
        run: npx tsx scripts/fetch-aircraft.ts

      - name: Zapisz na gałęzi data (jeden commit, force push)
        run: |
          set -e
          tmp=$(mktemp -d)
          cp -r public/data/. "$tmp/"
          cd "$tmp"
          git init -q -b data
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add .
          git commit -q -m "aircraft: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
